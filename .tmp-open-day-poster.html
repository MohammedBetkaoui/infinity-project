<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;width:464px;height:832px;overflow:hidden;background:#00170f}canvas{display:block;width:464px;height:832px}</style>
<canvas id="poster" width="464" height="832"></canvas>
<video id="film" muted preload="auto" src="./public/open-day/video_2026-10-10_15-09-43.mp4" hidden></video>
<script>
  const film = document.querySelector('#film')
  film.addEventListener('loadedmetadata', () => { film.currentTime = .5 })
  film.addEventListener('seeked', () => {
    document.querySelector('#poster').getContext('2d').drawImage(film, 0, 0)
    document.documentElement.dataset.ready = 'true'
  }, { once: true })
</script>
