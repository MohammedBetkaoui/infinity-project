<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#094A36" />
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="/infinity-favicon.svg" />
    <meta
      name="description"
      content="Infinity Club, the science and technology club of the Faculty of Mathematics and Computer Science at the University of Bordj Bou Arreridj."
    />
    <!--
      Base head for the SPA entry. scripts/seo-build.mjs rewrites the title,
      description and social tags per public route at build time (from
      src/seo/seoConfig.js) and writes one static document per route, so
      crawlers that do not run JavaScript still read the right metadata.
      These defaults are the homepage's, and are what any route without its
      own generated document falls back to.
    -->
    <link rel="canonical" href="https://www.infinty-bba.com/" />
    <meta property="og:site_name" content="Infinity Club" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.infinty-bba.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.infinty-bba.com/assets/og-infinity-club.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Used only by the AIVEX preparation checklist section. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <title>Infinity Club | No Limits For Infiniters</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
