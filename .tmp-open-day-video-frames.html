<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#00170f;color:#f1ebdd;font:14px system-ui}main{display:grid;grid-template-columns:repeat(3,232px);gap:18px;padding:18px}figure{margin:0}canvas{display:block;width:232px;height:416px;background:#000;border:1px solid #9ed7c4}figcaption{padding-top:8px}
</style>
<main id="frames"></main>
<video id="film" muted preload="auto" src="./public/open-day/video_2026-10-10_15-09-43.mp4" hidden></video>
<script>
  const film = document.querySelector('#film')
  const times = [0.5, 6, 10, 18, 22, 30]
  film.addEventListener('loadedmetadata', async () => {
    for (const time of times) {
      await new Promise((resolve) => {
        film.addEventListener('seeked', resolve, { once: true })
        film.currentTime = time
      })
      const figure = document.createElement('figure')
      const canvas = document.createElement('canvas')
      canvas.width = film.videoWidth
      canvas.height = film.videoHeight
      canvas.getContext('2d').drawImage(film, 0, 0)
      const caption = document.createElement('figcaption')
      caption.textContent = `${time.toFixed(1)} seconds`
      figure.append(canvas, caption)
      document.querySelector('#frames').append(figure)
    }
    document.documentElement.dataset.ready = 'true'
  })
</script>
